<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="description" content="Find. Preview. Download. Instantly.">
    <title>SanStudio Subtitle Hub</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Phosphor Icons (Premium Iconography) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Google Fonts (Inter / Roboto Flex fallback) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Roboto+Flex:opsz,wght@8..144,300..800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Roboto Flex', 'system-ui', 'sans-serif'],
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
                    },
                    colors: {
                        primary: 'var(--color-primary)',
                        'primary-light': 'var(--color-primary-light)',
                        surface: 'var(--color-surface)',
                        'surface-glass': 'var(--color-surface-glass)',
                        background: 'var(--color-background)',
                        text: 'var(--color-text)',
                        'text-muted': 'var(--color-text-muted)',
                        border: 'var(--color-border)',
                    },
                    boxShadow: {
                        'soft': '0 10px 40px -10px rgba(0,0,0,0.08)',
                        'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.05)',
                        'float': '0 20px 40px -5px rgba(0, 0, 0, 0.1)',
                        'origin': '0 4px 20px rgba(0,0,0,0.05), inset 0 0 0 0.5px rgba(255,255,255,0.4)',
                    },
                    animation: {
                        'spring-up': 'springUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
                        'fade-in': 'fadeIn 0.3s ease-out forwards',
                        'ripple': 'ripple 0.6s linear',
                        'scale-in': 'scaleIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
                    },
                    keyframes: {
                        springUp: {
                            '0%': { transform: 'translateY(20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        ripple: {
                            '0%': { transform: 'scale(0)', opacity: '0.5' },
                            '100%': { transform: 'scale(4)', opacity: '0' },
                        },
                        scaleIn: {
                            '0%': { transform: 'scale(0.95)', opacity: '0' },
                            '100%': { transform: 'scale(1)', opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            /* OriginOS / Android 16 Light Theme */
            --color-primary: #0055FF;
            --color-primary-light: #E5EEFF;
            --color-background: #F2F4F8; /* Slightly deeper gray for OriginOS depth */
            --color-surface: #FFFFFF;
            --color-surface-glass: rgba(255, 255, 255, 0.75);
            --color-text: #1A1D20;
            --color-text-muted: #64748B;
            --color-border: rgba(0, 0, 0, 0.06);
            
            --glass-border: rgba(255, 255, 255, 0.6);
            --glass-blur: 24px;
        }

        .dark {
            /* OLED Black / Material You Dark */
            --color-primary: #3377FF;
            --color-primary-light: #1A2942;
            --color-background: #000000;
            --color-surface: #121212;
            --color-surface-glass: rgba(28, 28, 30, 0.75);
            --color-text: #F8FAFC;
            --color-text-muted: #94A3B8;
            --color-border: rgba(255, 255, 255, 0.08);
            
            --glass-border: rgba(255, 255, 255, 0.05);
        }

        * {
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--color-background);
            color: var(--color-text);
            overflow-x: hidden;
            overscroll-behavior-y: none; /* Prevent pull-to-refresh for native feel */
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Glassmorphism utility */
        .glass {
            background: var(--color-surface-glass);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            box-shadow: var(--tw-shadow-origin);
        }

        /* Hide scrollbars structurally but allow scrolling */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Custom Scrollbar for Previews */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: var(--color-border);
            border-radius: 10px;
        }

        /* Ripple effect container */
        .ripple-btn {
            position: relative;
            overflow: hidden;
        }
        .ripple-element {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0);
            pointer-events: none;
            animation: ripple 0.6s linear;
        }
        .dark .ripple-element {
            background: rgba(0, 0, 0, 0.2);
        }

        /* Dynamic Island / Toast */
        #toast-container {
            position: fixed;
            top: env(safe-area-inset-top, 20px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }
        .toast {
            background: var(--color-surface);
            color: var(--color-text);
            padding: 12px 24px;
            border-radius: 999px;
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.3);
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: springUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            border: 1px solid var(--color-border);
        }

        /* Syntax Highlighting for Subtitle Preview */
        .preview-line { padding: 2px 0; display: flex; font-family: var(--font-mono); font-size: 0.85rem; line-height: 1.5; }
        .preview-num { width: 40px; color: var(--color-text-muted); text-align: right; padding-right: 12px; user-select: none; opacity: 0.5; }
        .preview-text { flex: 1; white-space: pre-wrap; word-break: break-all; }
        .srt-time { color: #3b82f6; font-weight: 600; }
        .dark .srt-time { color: #60a5fa; }
        .srt-tag { color: #a855f7; }
        .dark .srt-tag { color: #c084fc; }

        /* Layout Transitions */
        .page-enter {
            animation: scaleIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Safe area padding for mobile notches */
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 1rem); }
        .pt-safe { padding-top: env(safe-area-inset-top, 1rem); }
    </style>
</head>

    <script>
        /**
         * CORE STATE
         * This app relies completely on the user's local filesystem via IndexedDB.
         * There are no fake/mock databases.
         */
        const state = {
            searchQuery: '',
            searchResults: [],
            isSearching: false,
            bookmarks: new Set(),
            theme: localStorage.getItem('theme') || 'auto',
            reduceMotion: localStorage.getItem('reduceMotion') === 'true',
            stats: { totalFiles: 0, totalSize: 0 }
        };

        /**
         * IndexedDB Architecture
         * Stores actual File Blobs to allow offline access, searching, and exporting.
         */
        const DB_NAME = 'SanStudioRealDB';
        const DB_VERSION = 1;
        let db;

        const initDB = () => {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                
                request.onerror = (event) => reject("IndexedDB error: " + event.target.error);
                
                request.onsuccess = (event) => {
                    db = event.target.result;
                    loadUserPreferences();
                    updateStats();
                    resolve(db);
                };
                
                request.onupgradeneeded = (event) => {
                    const db = event.target.result;
                    // Store metadata and blob together
                    if (!db.objectStoreNames.contains('subtitles')) {
                        const subStore = db.createObjectStore('subtitles', { keyPath: 'id' });
                        subStore.createIndex('title', 'title', { unique: false });
                        subStore.createIndex('uploadDate', 'uploadDate', { unique: false });
                        subStore.createIndex('type', 'type', { unique: false });
                    }
                    if (!db.objectStoreNames.contains('bookmarks')) {
                        db.createObjectStore('bookmarks', { keyPath: 'id' });
                    }
                };
            });
        };

        const loadUserPreferences = () => {
            if(!db) return;
            const tx = db.transaction(['bookmarks'], 'readonly');
            const bmStore = tx.objectStore('bookmarks');
            const bmRequest = bmStore.getAll();
            bmRequest.onsuccess = () => {
                state.bookmarks = new Set(bmRequest.result.map(item => item.id));
                updateUIForBookmarks();
            };
        };

        const updateStats = () => {
            if(!db) return;
            const tx = db.transaction('subtitles', 'readonly');
            const store = tx.objectStore('subtitles');
            const req = store.getAll();
            req.onsuccess = () => {
                const subs = req.result;
                state.stats.totalFiles = subs.length;
                state.stats.totalSize = subs.reduce((acc, curr) => acc + (curr.rawSize || 0), 0);
                
                // Re-initialize worker with fresh data whenever stats update
                searchWorker.postMessage({ type: 'INIT', payload: subs.map(s => ({...s, blob: null})) }); // strip blob for worker memory
                
                // Trigger UI update if on home or admin
                if(window.location.hash === '#/home' || window.location.hash === '' || window.location.hash === '#/admin') {
                    // Slight delay to allow DOM to settle if called during route change
                    setTimeout(() => {
                        const statsEl = document.getElementById('stat-total-files');
                        if(statsEl) statsEl.innerText = state.stats.totalFiles;
                    }, 100);
                }
            };
        };

        /**
         * Real Local File Parsing Logic
         */
        function formatBytes(bytes, decimals = 2) {
            if (!+bytes) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return `${parseFloat((bytes / Math.pow(k, i)).toFixed(dm))} ${sizes[i]}`;
        }

        function extractMetadataFromFilename(filename) {
            let title = filename.replace(/\.(srt|vtt|ass)$/i, '').replace(/\./g, ' ');
            let type = 'Movie';
            let season = null;
            let episode = null;
            let year = null;

            // Regex for S01E01 or s1e1 format
            const seMatch = title.match(/s(\d{1,2})e(\d{1,2})/i);
            if (seMatch) {
                type = 'Series';
                season = parseInt(seMatch[1], 10);
                episode = parseInt(seMatch[2], 10);
                title = title.replace(seMatch[0], '').trim();
            }

            // Regex for Year (e.g., 2023)
            const yearMatch = title.match(/(19|20)\d{2}/);
            if (yearMatch && !season) { // If it's a series, year is less relevant for title display usually
                year = yearMatch[0];
                title = title.replace(yearMatch[0], '').trim();
            }

            // Cleanup trailing dashes or brackets
            title = title.replace(/[-_\[\]()]/g, ' ').replace(/\s+/g, ' ').trim();

            return { title, type, season, episode, year };
        }

        async function processFiles(files) {
            if (!db) {
                showToast("Database not ready", "error");
                return;
            }

            const tx = db.transaction('subtitles', 'readwrite');
            const store = tx.objectStore('subtitles');
            let addedCount = 0;

            showToast("Processing files...", "info");

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const ext = file.name.split('.').pop().toLowerCase();
                
                if (['srt', 'vtt', 'ass'].includes(ext)) {
                    const meta = extractMetadataFromFilename(file.name);
                    
                    const subData = {
                        id: 'sub_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
                        filename: file.name,
                        title: meta.title || file.name,
                        type: meta.type,
                        season: meta.season,
                        episode: meta.episode,
                        year: meta.year || 'Unknown',
                        format: ext.toUpperCase(),
                        size: formatBytes(file.size),
                        rawSize: file.size,
                        uploadDate: Date.now(),
                        blob: file // Store the actual file blob
                    };

                    store.put(subData);
                    addedCount++;
                }
            }

            tx.oncomplete = () => {
                showToast(`Successfully indexed ${addedCount} subtitles!`, "success");
                updateStats();
                if(window.location.hash === '#/admin') router.handleHashChange(); // Refresh view
            };

            tx.onerror = () => {
                showToast("Error saving files to library.", "error");
            };
        }

        const toggleBookmark = (subId, event) => {
            if(event) event.stopPropagation();
            if (!db) return;

            const subTx = db.transaction('subtitles', 'readonly');
            const subStore = subTx.objectStore('subtitles');
            const req = subStore.get(subId);

            req.onsuccess = () => {
                const subtitle = req.result;
                if (!subtitle) return;

                const tx = db.transaction('bookmarks', 'readwrite');
                const store = tx.objectStore('bookmarks');

                if (state.bookmarks.has(subId)) {
                    store.delete(subId);
                    state.bookmarks.delete(subId);
                    showToast('Removed from saved items', 'info');
                } else {
                    store.put({ id: subtitle.id, timestamp: Date.now() });
                    state.bookmarks.add(subId);
                    showToast('Saved to offline bookmarks', 'success');
                }
                updateUIForBookmarks();
                
                // Refresh views if necessary
                if(window.location.hash === '#/bookmarks') router.handleHashChange();
            };
        };

        /**
         * Web Worker for Search Engine
         * Kept in a Blob URL to maintain the single-file architecture while offloading main thread.
         */
        const searchWorkerCode = `
            let dbData = [];
            
            self.onmessage = function(e) {
                const { type, payload } = e.data;
                
                if (type === 'INIT') {
                    dbData = payload; // Array of metadata without heavy Blobs
                } 
                else if (type === 'SEARCH') {
                    const query = payload.toLowerCase().trim();
                    if (!query) {
                        postMessage({ type: 'RESULTS', results: [] });
                        return;
                    }

                    // Performant substring & token matching
                    const results = dbData.map(item => {
                        let score = 0;
                        const titleLower = item.title.toLowerCase();
                        const filenameLower = item.filename.toLowerCase();
                        
                        if (titleLower === query) score += 100;
                        else if (titleLower.startsWith(query)) score += 50;
                        else if (titleLower.includes(query)) score += 10;
                        
                        if (filenameLower.includes(query)) score += 5;

                        return { item, score };
                    })
                    .filter(res => res.score > 0)
                    .sort((a, b) => b.score - a.score || b.item.uploadDate - a.item.uploadDate)
                    .map(res => res.item)
                    .slice(0, 100); // Max 100 results for UI performance

                    postMessage({ type: 'RESULTS', results });
                }
            };
        `;

        const blob = new Blob([searchWorkerCode], { type: 'application/javascript' });
        const workerUrl = URL.createObjectURL(blob);
        const searchWorker = new Worker(workerUrl);

        searchWorker.onmessage = function(e) {
            const { type, results } = e.data;
            if (type === 'RESULTS') {
                state.searchResults = results;
                renderSearchResults(state.searchQuery, results);
            }
        };

        /**

                '/settings': renderSettings,
                '/subtitle/:id': renderSubtitleDetail
            },
            
            navigate(path) {
                window.location.hash = path;
            },
            
            handleHashChange() {
                const hash = window.location.hash.slice(1) || '/home';
                if(hash.startsWith('/search')) return;

                const appContent = document.getElementById('app-content');
                appContent.innerHTML = '<div class="flex h-[60vh] items-center justify-center"><div class="w-10 h-10 border-4 border-border border-t-primary rounded-full animate-spin"></div></div>';
                
                let matched = false;
                for (const route in this.routes) {
                    const paramMatch = route.match(/:([^\/]+)/g);
                    if (paramMatch) {
                        const regexStr = route.replace(/:([^\/]+)/g, '([^/]+)');
                        const regex = new RegExp(`^${regexStr}$`);
                        const match = hash.match(regex);
                        if (match) {
                            setTimeout(() => this.routes[route](match[1]), 30); 
                            matched = true;
                            break;
                        }
                    } else if (route === hash) {
                        setTimeout(() => this.routes[route](), 30);
                        matched = true;
                        break;
                    }
                }
                
                if (!matched) this.navigate('/home');
                updateActiveNav(hash);
                
                // Clear search input if leaving search route
                if(!hash.startsWith('/search')) {
                    const searchInput = document.getElementById('global-search');
                    if(searchInput.value) {
                        searchInput.value = '';
                        document.getElementById('clear-search').classList.add('hidden');
                    }
                }
            }
        };

        function updateActiveNav(hash) {
            const baseHash = hash.split('?')[0];
            document.querySelectorAll('.nav-item, .nav-item-mobile').forEach(el => {
                el.classList.remove('active-nav');
                if (el.getAttribute('href') === `#${baseHash}` || (baseHash.startsWith('/subtitle') && el.getAttribute('href') === '#/library')) {

            });

            if(!db) return;
            const tx = db.transaction('subtitles', 'readonly');
            const store = tx.objectStore('subtitles');
            const req = store.get(id);

            req.onsuccess = () => {
                const sub = req.result;
                if(!sub) return;

                const url = URL.createObjectURL(sub.blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = sub.filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                showToast(`Exported ${sub.filename}`, 'success');
            };
        };

                                <div>
                                    <h4 class="font-bold text-base">Dark Mode</h4>
                                    <p class="text-xs text-text-muted font-medium mt-0.5">Toggle OLED friendly dark theme.</p>
                                </div>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" class="sr-only peer" ${isDark ? 'checked' : ''} onchange="toggleTheme()">
                                <div class="w-12 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-primary shadow-inner"></div>
                            </label>
                        </div>
                        
                        <div class="p-5 flex items-center justify-between hover:bg-surface/50 transition-colors rounded-b-[1.75rem]">
                             <div class="flex items-center gap-4">
                                <div class="w-12 h-12 rounded-2xl bg-primary/10 flex items-center justify-center text-primary">
                                    <i class="ph-bold ph-magic-wand text-2xl"></i>
                                </div>
                                <div>
                                    <h4 class="font-bold text-base">Reduce Motion</h4>
                                    <p class="text-xs text-text-muted font-medium mt-0.5">Disable UI spring animations.</p>
                                </div>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" class="sr-only peer" ${state.reduceMotion ? 'checked' : ''} onchange="toggleMotion()">
                                <div class="w-12 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-primary shadow-inner"></div>
                            </label>
                        </div>
                    </div>
                    
                    <div class="text-center mt-12 opacity-60 hover:opacity-100 transition-opacity">
                        <i class="ph-fill ph-subtitles text-5xl text-primary mb-3"></i>
                        <p class="text-sm font-bold tracking-wide">SanStudio Subtitle Hub</p>
                        <p class="text-xs font-medium mt-1">Local PWA Engine v2.0</p>
                    </div>
                </div>
            `;
        }

        function toggleTheme() {
            const html = document.documentElement;
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }

        function toggleMotion() {
            state.reduceMotion = !state.reduceMotion;
            localStorage.setItem('reduceMotion', state.reduceMotion);
            if(state.reduceMotion) {
                document.body.style.setProperty('--animate-duration', '0.01ms');
            } else {
                document.body.style.removeProperty('--animate-duration');
            }
        }

        function clearDatabase() {
            if(confirm("Are you sure you want to delete all indexed files and metadata? The original files on your computer will remain safe.")) {
                const req = indexedDB.deleteDatabase(DB_NAME);
                req.onsuccess = () => {
                    showToast("Database wiped. Reloading...", "success");
                    setTimeout(() => window.location.reload(), 1500);
                };
            }
        }

        function updateUIForBookmarks() {
            document.querySelectorAll('[class*="bookmark-icon-"]').forEach(icon => {
                const match = icon.className.match(/bookmark-icon-(sub_[A-Za-z0-9_]+)/);
                if(match) {
                    const id = match[1];
                    if (state.bookmarks.has(id)) {
                        icon.classList.remove('ph-bold', 'text-text-muted');
                        icon.classList.add('ph-fill', 'text-primary');
                    } else {
                        icon.classList.remove('ph-fill', 'text-primary');
                        icon.classList.add('ph-bold', 'text-text-muted');
                    }
                }
            });
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast glass';
            
            const icon = type === 'success' ? '<i class="ph-fill ph-check-circle text-green-500 text-xl drop-shadow-sm"></i>' : 
                         type === 'error' ? '<i class="ph-fill ph-warning-circle text-red-500 text-xl drop-shadow-sm"></i>' : 
                         '<i class="ph-fill ph-info text-primary text-xl drop-shadow-sm"></i>';
                         
            toast.innerHTML = `${icon} <span>${message}</span>`;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'scaleIn 0.3s ease-in reverse forwards';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Search Input Handling
        let searchTimeout;
        const searchInput = document.getElementById('global-search');
        const clearBtn = document.getElementById('clear-search');

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value;
            state.searchQuery = query;
            
            if (query.length > 0) {
                clearBtn.classList.remove('hidden');
                if(!window.location.hash.startsWith('#/search')) {
                    window.history.pushState(null, '', '#/search');
                    updateActiveNav('#/search');
                }
            } else {
                clearBtn.classList.add('hidden');
                if(window.location.hash.startsWith('#/search')) {
                    window.history.back();
                }
                return;
            }

            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                searchWorker.postMessage({ type: 'SEARCH', payload: query });
            }, 150); // Fast 150ms debounce for local search
        });

        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            searchInput.dispatchEvent(new Event('input'));
            searchInput.focus();
        });

        // Add Ripple Effect
        document.addEventListener('click', function(e) {
            const target = e.target.closest('.ripple-btn');
            if (!target) return;
            const rect = target.getBoundingClientRect();
            const ripple = document.createElement('div');
            const size = Math.max(rect.width, rect.height);
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = e.clientX - rect.left - size / 2 + 'px';
            ripple.style.top = e.clientY - rect.top - size / 2 + 'px';
            ripple.className = 'ripple-element';
            target.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        });

        // Header Style on Scroll
        window.addEventListener('scroll', () => {
            const header = document.getElementById('main-header');
            if (window.scrollY > 10) {
                header.classList.add('shadow-glass', 'bg-surface-glass');
                header.classList.replace('py-4', 'py-2');
                header.classList.replace('md:py-4', 'md:py-2');
            } else {
                header.classList.remove('shadow-glass', 'bg-surface-glass');
                header.classList.replace('py-2', 'py-4');
                header.classList.replace('md:py-2', 'md:py-4');
            }
        });

        // Initialize App
        window.addEventListener('hashchange', () => router.handleHashChange());
        
        window.addEventListener('DOMContentLoaded', async () => {
            // Apply Theme Preferences
            if (state.theme === 'dark' || (state.theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
            if(state.reduceMotion) {
                document.body.style.setProperty('--animate-duration', '0.01ms');
            }

            try {
                await initDB();
                console.log("Real DB Initialized.");
            } catch(e) {
                showToast("Could not access local storage.", "error");
                console.error(e);
            }

            if (!window.location.hash) {
                window.location.hash = '#/home';
            } else {
                router.handleHashChange();
            }
        });

        /**
         * Dynamic Service Worker
         */
        if ('serviceWorker' in navigator) {
            const swCode = `
                const CACHE_NAME = 'sanstudio-real-pwa-v2';
                const urlsToCache = [
                    '/',
                    'https://cdn.tailwindcss.com',
                    'https://unpkg.com/@phosphor-icons/web',
                    'https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Roboto+Flex:opsz,wght@8..144,300..800&display=swap'
                ];

                self.addEventListener('install', event => {
                    event.waitUntil(caches.open(CACHE_NAME).then(cache => cache.addAll(urlsToCache)));
                });

                self.addEventListener('fetch', event => {
                    event.respondWith(
                        caches.match(event.request).then(response => response || fetch(event.request))
                    );
                });
            `;
            
            try {
                const swBlob = new Blob([swCode], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(swBlob);
                navigator.serviceWorker.register(swUrl).then(registration => {
                    console.log('PWA ServiceWorker registered.');
                }).catch(() => {});
            } catch(e) {}
        }
    </script>
</body>
</html>
